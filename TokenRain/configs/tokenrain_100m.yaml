# TokenRain-100M-Base v0.2
# 全模型维度对齐 2^N；词表 8,192 = 2^13；上下文 4,096 = 2^12。
version: v0.2

model:
  vocab_size: 8192
  hidden_size: 1024
  num_hidden_layers: 14
  num_attention_heads: 16
  num_key_value_heads: 4
  head_dim: 64
  intermediate_size: 2048
  max_position_embeddings: 4096
  rope_theta: 10000.0
  partial_rope_dim: 32        # 每个 head 前 32 维做 RoPE
  token_shift_dim: 256        # 1/4 通道做 t-1 时间移位
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true
  initializer_range: 0.02
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  unk_token_id: 3

data:
  raw_dirs:
    - data/train_input
  hanzi_file: data/tokenizer/tokenrain/hanzi.txt
  symbols_file: data/tokenizer/tokenrain/symbols.txt
  packed_dir: data/processed/tokenrain_packed
  val_ratio: 0.02
  doc_chars: 3000
  min_doc_chars: 100
  min_cjk_ratio: 0.5

train:
  seed: 42                    # 数据随机顺序由 seed 和当前 epoch 共同决定
  output_dir: outputs/tokenrain_100m
  total_tokens: 29_0000
  seq_len: 512
  global_batch_tokens: 1024
  micro_batch_size: 1
  precision: fp32
  learning_rate: 8.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  log_every_steps: 5
  eval_interval_tokens: 10_0000
  eval_batches: 4
  save_interval_tokens: 20_0000
  resume: auto
